<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're all set — Remira</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/remira-favicon.png" />

    <!--
      Landing page for every emailed auth link: confirm signup, magic link, email change.
      Supabase consumes the token server-side before redirecting here, so this page needs
      no logic — it only tells the person to go back to the app. Deliberately self-contained
      with no webfont, so it renders instantly on a phone straight out of a mail client.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f2f4f8;
        --muted: #9aa6bd;
        --accent: #79d9ec;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Ambient glow */
      .glow {
        position: fixed;
        top: -10%;
        left: 50%;
        transform: translateX(-50%);
        width: 560px;
        max-width: 120vw;
        height: 560px;
        border-radius: 50%;
        background: rgba(121, 217, 236, 0.1);
        filter: blur(120px);
        pointer-events: none;
        z-index: 0;
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 360px;
      }

      .check {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(121, 217, 236, 0.12);
        border: 1px solid rgba(121, 217, 236, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 22px;
      }
      .check svg { width: 32px; height: 32px; color: var(--accent); }

      h1 {
        font-size: clamp(24px, 7vw, 30px);
        font-weight: 700;
        line-height: 1.15;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
        margin: 0;
      }

      .foot {
        margin-top: 36px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 13.5px;
      }
      .foot a { color: var(--muted); text-decoration: none; }
      .foot a:hover { color: var(--accent); }
    </style>
  </head>

  <body>
    <div class="glow" aria-hidden="true"></div>

    <main>
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>

      <h1>You're all set.</h1>
      <p>Open Remira on your phone to continue.</p>

      <div class="foot">
        <a href="/support/">Need help?</a>
      </div>
    </main>
  </body>
</html>
